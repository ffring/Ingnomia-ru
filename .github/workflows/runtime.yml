name: Runtime proof (existing package)

# Manual Windows diagnostic: re-run the launch-only runtime proof against a package that an
# earlier "CMake" run already built. Nothing is compiled, the downloaded ZIP is not modified,
# and no gameplay is tested (the helper never sends input).

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run ID of the CMake workflow run that produced the package artifact"
        required: true
        default: '39054354242'
      noesis:
        description: "Noesis mode used by that run (artifact name suffix)"
        type: choice
        options:
          - evaluation
          - licensed
        default: evaluation

permissions:
  actions: read
  contents: read

jobs:
  runtime-proof:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4   # only for tools/qa/verify_windows.ps1

    - name: Download existing package
      uses: actions/download-artifact@v4
      with:
        name: "Ingnomia-ru-windows-${{ inputs.noesis }}-${{ inputs.source_run_id }}"
        run-id: ${{ inputs.source_run_id }}
        repository: ${{ github.repository }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/source-artifact

    - name: Runtime proof (window launch, software OpenGL)
      shell: pwsh
      env:
        MESA_URL: https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z
        MESA_SHA256: 351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695
      run: |
        $ErrorActionPreference = 'Stop'
        $proof = Join-Path $env:RUNNER_TEMP 'runtime-proof'
        New-Item -ItemType Directory -Force -Path $proof | Out-Null

        $zip = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'source-artifact') -Recurse -Filter 'Ingnomia-ru-*.zip' | Select-Object -First 1
        if (-not $zip) { throw "no package ZIP in the downloaded artifact" }
        $zipHash = (Get-FileHash -Algorithm SHA256 $zip.FullName).Hash.ToLowerInvariant()
        $shaFile = "$($zip.FullName).sha256"
        $expected = if (Test-Path $shaFile) { ((Get-Content $shaFile -Raw).Trim() -split '\s+')[0].ToLowerInvariant() } else { $null }
        [ordered]@{
          source_run_id = '${{ inputs.source_run_id }}'
          package = $zip.Name
          size = $zip.Length
          sha256 = $zipHash
          sha256_from_artifact = $expected
          sha256_matches = ($null -ne $expected -and $expected -eq $zipHash)
        } | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $proof 'source-package.json')
        if ($null -ne $expected -and $expected -ne $zipHash) { throw "package SHA256 differs from the artifact's .sha256 file" }

        # fresh test copy; the downloaded ZIP stays untouched
        $runtime = Join-Path $env:RUNNER_TEMP 'runtime'
        if (Test-Path $runtime) { Remove-Item -Recurse -Force $runtime }
        Expand-Archive -Path $zip.FullName -DestinationPath $runtime
        $game = Join-Path $runtime 'Ingnomia-ru'
        if (-not (Test-Path (Join-Path $game 'Ingnomia.exe'))) { throw "Ingnomia.exe missing after extracting $($zip.Name)" }

        # test-only software OpenGL, copied into the test copy only (same pin as cmake.yml)
        $mesa7z = Join-Path $env:RUNNER_TEMP 'mesa3d.7z'
        Invoke-WebRequest -Uri $env:MESA_URL -OutFile $mesa7z
        $hash = (Get-FileHash -Algorithm SHA256 $mesa7z).Hash.ToLowerInvariant()
        if ($hash -ne $env:MESA_SHA256) { throw "Mesa archive SHA256 mismatch: $hash" }
        $mesa = Join-Path $env:RUNNER_TEMP 'mesa3d'
        7z x $mesa7z "-o$mesa" -y | Out-Null
        if ($LASTEXITCODE -ne 0) { throw "7z failed to extract the Mesa archive" }
        foreach ($dll in @('opengl32.dll', 'libgallium_wgl.dll', 'libglapi.dll')) {
          $src = Join-Path $mesa "x64\$dll"
          if (Test-Path $src) { Copy-Item $src $game -Force; Write-Host "app-local test driver: $dll" }
          elseif ($dll -ne 'libglapi.dll') { throw "Mesa archive has no x64\$dll" }
        }

        # diagnostics for this test process only; nothing is written into the package
        $env:GALLIUM_DRIVER = 'llvmpipe'
        $env:LIBGL_ALWAYS_SOFTWARE = '1'
        $env:QT_OPENGL = 'desktop'
        $env:QT_DEBUG_PLUGINS = '1'
        # Hosted runners have no playback device. Use OpenAL Soft's null backend only here.
        $env:ALSOFT_DRIVERS = 'null'
        $env:ALSOFT_LOGLEVEL = '3'
        $env:ALSOFT_LOGFILE = Join-Path $proof 'openal.log'
        Get-ChildItem $game -File | Select-Object Name, Length | Format-Table -AutoSize | Out-String -Width 200 |
          Set-Content -Encoding UTF8 (Join-Path $proof 'game-root-files.txt')
        & ./tools/qa/verify_windows.ps1 -GameRoot $game -OutputDir $proof

    - name: Upload runtime proof
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: "Ingnomia-ru-runtime-only-proof-${{ inputs.noesis }}-${{ inputs.source_run_id }}-${{ github.run_id }}"
        path: ${{ runner.temp }}/runtime-proof/
        if-no-files-found: warn
